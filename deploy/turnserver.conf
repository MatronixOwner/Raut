# coturn — собственный STUN/TURN сервер Raut (без Google STUN).
# ВАЖНО: замените CHANGE_ME_strong_password и укажите ТОТ ЖЕ пароль
# в TURN_PASSWORD для docker compose (переменная RAUT_TURN_PASS).
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
# Если VPS за NAT, раскомментируйте и укажите: внешний_IP/внутренний_IP
# external-ip=203.0.113.10/10.0.0.5

fingerprint
lt-cred-mech
user=raut:CHANGE_ME_strong_password
realm=raut
server-name=raut

# Только UDP/TCP TURN и STUN, без лишних протоколов
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
no-loopback-peers

# Разрешаем ретрансляцию только на публичные адреса
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

pidfile=/var/run/turnserver.pid
log-file=stdout
simple-log
total-quota=200
bps-capacity=0
stale-nonce=600
channel-lifetime=-1
